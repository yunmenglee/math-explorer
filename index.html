<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>数学探索中心 · 知识宝典 (v24.6.4)</title>
<link rel="stylesheet" href="css/style.css?t=6">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#302b63">
<meta name="description" content="小学数学、初中数学、中考数学知识点全收录 - 2835条知识">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
</head>
<!-- D3.js for interactive knowledge graph -->
<script src="https://d3js.org/d3.v7.min.js"></script>
<body>
<div class="header">
  <div class="dec"><span></span><span></span><span></span><span></span><span></span><span></span></div>
  <button class="theme-btn" id="themeBtn" onclick="toggleTheme()" title="切换主题">🌙</button>
  <div class="hc">
    <h1>🧮 数学探索中心</h1>
    <div class="subtitle">小学 · 初中 · 中考</div>
    <div class="sb">
      <span class="ic">🔍</span>
      <input type="text" id="sq" placeholder="搜索知识点..." autocomplete="off" spellcheck="false">
      <span class="hk">⌘/</span>
    </div>
  </div>
</div>

<div id="loadingScreen" class="loading">
  <div class="spinner"></div>
  <h3>加载知识库中...</h3>
  <p style="font-size:13px;color:var(--text-muted);margin-top:8px">2835 条知识，马上就好</p>
</div>

<div class="hm" id="hm" style="display:none"></div>
<div class="qs" id="qs" style="display:none"></div>

<div class="br" id="br">
  <div class="tb">
    <span class="bh" id="navBackBtn" onclick="goHome()">← 返回首页</span>
    <span class="bh" id="navTbBtn" style="display:none" onclick="goBackToTextbook()">← 返回教材库</span>
    <div class="bh-group">
      <span class="bh bh-sm" onclick="randomKnowledge()" title="随机知识点">🎲 随机</span>
      <span class="bh bh-sm" onclick="showFavorites()" title="收藏夹">⭐ 收藏</span>
      <span class="bh bh-sm" onclick="showLearningProgress()" title="学习进度">📖 进度</span>
      <span class="bh bh-sm" onclick="toggleGraph()" title="知识图谱">📊 图谱</span>
    </div>
  </div>
  <div class="mt" id="mt"></div>
  <div class="mw">
    <span class="tg-btn" id="tg">☰ 分类筛选</span>
    <div class="sd" id="sd"></div>
    <div class="ct">
      <!-- Favorites & Progress panels (shown when toggled) -->
      <div id="extraPanels"></div>
      <div class="cr">
        <div class="info" id="st">共 <strong>0</strong> 条知识</div>
      </div>
      <div id="cps" class="cps"></div>
      <div class="ac" id="ac"></div>
      <div class="cb" id="cb"></div>
      <div id="rs"></div>
    </div>
  </div>
</div>

<!-- ===== TEXTBOOK VIEW ===== -->
<div class="tbv" id="tbv" style="display:none">
  <div class="tb">
    <span class="bh" onclick="goHomeFromTB()">← 返回首页</span>
    <div class="bh-group">
      <span class="bh bh-sm" id="tbvTitle" style="font-weight:700;font-size:15px">📘 教材库</span>
    </div>
  </div>
  <!-- Grade tabs for quick switching -->
  <div id="tbvGradeTabs" style="display:none;padding:4px 8px 0;flex-wrap:wrap;gap:4px"></div>
  <div class="tbv-body" id="tbvBody">
    <div class="tbv-col tbv-col-left" id="tbvColLeft">
      <div class="tbv-col-header">📚 选择教材版本</div>
      <div id="tbvStageTabs" style="display:flex;gap:6px;padding:8px 8px 0"></div>
      <div class="tbv-sel-bar" id="tbvSelBar" style="cursor:default;font-size:12px;color:var(--text-muted);padding:8px 12px">点击图标选择版本</div>
      <div id="tbvPubIcons" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;padding:8px"></div>
    </div>
    <div class="tbv-col tbv-col-mid" id="tbvColMid" style="display:none">
      <div class="tbv-col-header">📖 章节</div>
      <div id="tbvChapterList"></div>
    </div>
    <div class="tbv-col tbv-col-right" id="tbvColRight">
      <div class="tbv-col-header">📄 小节</div>
      <div class="tbv-section-list" id="tbvSectionList"></div>
    </div>
  </div>
  <!-- Comparison section -->
  <div class="tbv-compare" id="tbvCompare">
    <div class="tbv-compare-left">
      <div class="tbv-compare-btn" id="tbvCompareBtn" onclick="toggleCompare()">📊 教材对比</div>
    </div>
    <div class="tbv-compare-body" id="tbvCompareBody" style="display:none">
      <div class="tbv-compare-tabs">
        <span class="tbv-compare-tab on" id="ctabOver" onclick="switchCompareMode('over')">📌 超纲对比</span>
        <span class="tbv-compare-tab" id="ctabLearned" onclick="switchCompareMode('learned')">✅ 已学检测</span>
      </div>
      <!-- Over-standard mode -->
      <div id="cmpOver">
        <div class="tbv-compare-row">
          <div class="tbv-compare-pick" onclick="pickComparePrimary()">
            <span id="tbvCpLabel">点击选择主教材</span>
          </div>
          <span class="tbv-compare-vs">VS</span>
          <div class="tbv-compare-pick" onclick="pickCompareTarget()">
            <span id="tbvCtLabel">+ 添加对比教材</span>
          </div>
        </div>
        <div class="tbv-compare-tags" id="tbvCompareTargets"></div>
        <div class="tbv-compare-results" id="tbvCompareResults"><div class="tbv-cr-empty">请选择主教材和对比教材</div></div>
      </div>
      <!-- Learned-check mode -->
      <div id="cmpLearned" style="display:none">
        <div class="tbv-compare-row">
          <div class="tbv-compare-pick" onclick="pickLearnedPrimary()">
            <span id="tbvLpLabel">点击选择主教材</span>
          </div>
          <span class="tbv-compare-vs">已学教材</span>
          <div class="tbv-compare-pick" onclick="pickLearnedTarget()">
            <span id="tbvLtLabel">+ 添加已学教材</span>
          </div>
        </div>
        <div class="tbv-compare-tags" id="tbvLearnedTags"></div>
        <div class="tbv-compare-results" id="tbvLearnedResults"><div class="tbv-cr-empty">请选择主教材和至少一本已学教材</div></div>
      </div>
    </div>
  </div>
</div>

<!-- Textbook picker modal -->
<div class="tbv-picker-overlay" id="tbvPicker" style="display:none" onclick="hideBookPicker(event)">
  <div class="tbv-picker-modal" onclick="event.stopPropagation()">
    <div class="tbv-picker-header" id="tbvPickerHeader">📚 选择教材版本 <span class="tbv-picker-close" onclick="hideBookPicker()">✕</span></div>
    <div class="tbv-picker-grid" id="tbvPickerGrid"></div>
  </div>
</div>

<!-- ===== KNOWLEDGE GRAPH CONTAINER ===== -->
<div id="graphContainer" class="graph-container" style="display:none">
  <div class="graph-toolbar">
    <span class="graph-title">📊 知识图谱</span>
    <div class="graph-legend" id="graphLegend"></div>
    <span class="graph-hint">拖拽节点 · 滚轮缩放 · 悬停查看 · 点击筛选</span>
  </div>
  <div id="graphSvg" class="graph-svg"></div>
</div>

<div class="mmodal" id="mv"></div>

<script>
const STORE_KEY = 'math_explorer';

// State
let D = [];
let S = {};
let T = {};
let C = {};
let Q = [];
let meta = {};
let TB = [];
let st = {m:'',c1:'',c2:'',tp:'all',q:'',ar:'',sdTab:'',loc:''};
let isDataLoaded = false;
let preferDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

// ===== DATA LOADING =====
async function loadData() {
  try {
    const [entries, summary, cats, regions, quotes, metadata, textbooks] = await Promise.all([
      fetch('data/entries.json').then(r=>r.json()),
      fetch('data/summary.json').then(r=>r.json()),
      fetch('data/categories.json').then(r=>r.json()),
      fetch('data/regions.json').then(r=>r.json()),
      fetch('data/quotes.json').then(r=>r.json()),
      fetch('data/meta.json').then(r=>r.json()),
      fetch('data/textbooks.json?cb='+Date.now()).then(r=>r.json()),
    ]);
    D = entries;
    S = summary;
    T = cats;
    C = regions;
    Q = quotes;
    meta = metadata;
    TB = textbooks || [];
    isDataLoaded = true;
    document.getElementById('loadingScreen').style.display = 'none';
    document.getElementById('hm').style.display = 'block';
    document.getElementById('qs').style.display = 'block';
    init();
  } catch(e) {
    document.getElementById('loadingScreen').innerHTML = 
      '<div class="em"><div class="e">❌</div><h3>加载失败：'+e.message+'</h3><p style="color:var(--text-muted);margin-top:8px">请检查网络后刷新页面</p></div>';
  }
}

// ===== INIT =====
function init() {
  restoreTheme();
  renderHome();
  renderQuote();
  setupSearch();
  setupSidebarToggle();
  setupKeyboard();
  loadUserData();
  // If returning to browse mode, restore
  if (st.m) {
    document.getElementById('hm').style.display = 'none';
    document.getElementById('qs').style.display = 'none';
    document.getElementById('br').classList.add('sh');
    renderModuleTabs();
    renderSidebar();
    renderResults();
  }
}

// ===== THEME =====
function toggleTheme() {
  const html = document.documentElement;
  const btn = document.getElementById('themeBtn');
  if (html.getAttribute('data-theme') === 'dark') {
    html.removeAttribute('data-theme');
    btn.textContent = '🌙';
    localStorage.setItem( STORE_KEY + '_theme', 'light');
  } else {
    html.setAttribute('data-theme', 'dark');
    btn.textContent = '☀️';
    localStorage.setItem( STORE_KEY + '_theme', 'dark');
  }
}
function restoreTheme() {
  const saved = localStorage.getItem( STORE_KEY + '_theme');
  const btn = document.getElementById('themeBtn');
  if (saved === 'dark' || (!saved && preferDark)) {
    document.documentElement.setAttribute('data-theme', 'dark');
    btn.textContent = '☀️';
  } else {
    btn.textContent = '🌙';
  }
}

// ===== HOME =====
function renderHome() {
  const el = document.getElementById('hm');
  const tbStat = function(stg) {
    const bs = TB.filter(b => (b.stage || '初中') === stg);
    return {
      books: bs.length,
      chs: bs.reduce((n,b) => n + b.chapters.length, 0),
      secs: bs.reduce((n,b) => n + b.chapters.reduce((n2,c) => n2 + c.sections.length, 0), 0)
    };
  };
  const sm = tbStat('小学'), jm = tbStat('初中');
  let h = '';

  // ===== 第一行: 教材库 =====
  h += `<div class="hs"><div class="hs-h">📚 教材库<span class="hs-sub">按教材目录组织章节，逐节学习</span></div><div class="hs-row">`;
  h += `<div class="cd small m1" onclick="enterTextbookStage('小学')">
    <div class="dv"></div>
    <div class="top"><div class="ico">🎒</div><div><div class="nm">小学</div><div class="ct">${sm.books} 本教材 · ${sm.chs} 章</div></div></div>
    <div class="desc">小学 1–6 年级教材目录与知识点</div>
    <div class="cs"><span class="tg">📘 ${sm.books} 套教材</span><span class="tg">📋 ${sm.secs} 节</span></div></div>`;
  h += `<div class="cd small m2" onclick="enterTextbookStage('初中')">
    <div class="dv"></div>
    <div class="top"><div class="ico">📐</div><div><div class="nm">初中</div><div class="ct">${jm.books} 本教材 · ${jm.chs} 章</div></div></div>
    <div class="desc">初中各版本教材目录与知识点</div>
    <div class="cs"><span class="tg">📘 ${jm.books} 套教材</span><span class="tg">📋 ${jm.secs} 节</span></div></div>`;
  h += `<div class="cd small m4 soon" onclick="enterTextbookStage('高中')">
    <div class="dv"></div>
    <div class="top"><div class="ico">🏫</div><div><div class="nm">高中<span class="soon-tag">即将上线</span></div><div class="ct">教材整理中</div></div></div>
    <div class="desc">高中数学教材目录正在整理，敬请期待</div>
    <div class="cs"><span class="tg">⏳ 敬请期待</span></div></div>`;
  h += `</div></div>`;

  // ===== 第二行: 学科知识库 =====
  h += `<div class="hs"><div class="hs-h">📖 学科知识库<span class="hs-sub">按知识点检索与学习</span></div><div class="hs-row">`;
  for (const k of ['小学','初中','中考']) {
    const mk = {'小学':'小学','初中':'初中','中考':'中考数学'}[k];
    const s2 = S[mk] || {n:0, cs:{}};
    const icons = {'小学':'🎒','初中':'📐','中考':'🎯'};
    const descs = {'小学':'从加减乘除到几何图形，打下坚实的数学基础','初中':'代数方程与几何证明，构建系统的数学思维','中考':'把握考情趋势，直击中考热点与难点'};
    const cats = Object.entries(s2.cs || {}).sort((a,b) => b[1]-a[1]).slice(0,8);
    const chips = cats.map(x => `<span class="tg">${esc(x[0])} <span class="nu">${x[1]}</span></span>`).join('');
    const cls = {'小学':'m1','初中':'m2','中考':'m3'}[k];
    h += `<div class="cd small ${cls}" onclick="enterModule('${k}')">
      <div class="dv"></div>
      <div class="top"><div class="ico">${icons[mk]||'💭'}</div><div><div class="nm">${k}</div><div class="ct">${s2.n} 条知识</div></div></div>
      <div class="desc">${descs[k]||''}</div>
      <div class="cs">${chips}</div></div>`;
  }
  h += `</div></div>`;
  el.innerHTML = h;
}

function enterTextbookStage(stg) {
  if (stg === '高中') { showHomeToast('高中教材正在整理中，敬请期待'); return; }
  tbvStage = stg;
  try { localStorage.setItem('tbvStage', stg); } catch(e) {}
  enterTextbook();
}

function showHomeToast(msg) {
  let t = document.getElementById('homeToast');
  if (!t) {
    t = document.createElement('div');
    t.id = 'homeToast';
    t.style.cssText = 'position:fixed;left:50%;bottom:46px;transform:translateX(-50%);background:rgba(20,20,25,.88);color:#fff;padding:10px 20px;border-radius:10px;font-size:13px;z-index:10001;opacity:0;transition:opacity .25s;pointer-events:none';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity = '1';
  clearTimeout(window._homeToastTimer);
  window._homeToastTimer = setTimeout(function(){ t.style.opacity = '0'; }, 2000);
}

function renderQuote() {
  const el = document.getElementById('qs');
  if (!el || !Q.length) return;
  const q = Q[Math.floor(Math.random() * Q.length)];
  el.innerHTML = `<div class="qc"><div class="qt"><span class="star">★</span> ${esc(q[0])} <span class="star">★</span></div><div class="qa">${esc(q[1])||''}</div></div>`;
}

// ===== NAVIGATION =====
function enterModule(m) {
  if (!requireAuth()) return;
  st = {m:{'小学':'小学','初中':'初中','中考':'中考数学'}[m],c1:'',c2:'',tp:'all',q:'',ar:'',sdTab:'',loc:''};
  document.getElementById('sq').value = '';
  document.getElementById('hm').style.display = 'none';
  document.getElementById('qs').style.display = 'none';
  document.getElementById('br').classList.add('sh');
  renderModuleTabs();
  renderSidebar();
  renderResults();
}

function goHome() {
  _fromTextbook = null;
  document.getElementById('navTbBtn').style.display = 'none';
  document.getElementById('navBackBtn').style.display = '';
  st = {m:'',c1:'',c2:'',tp:'all',q:'',ar:'',sdTab:'',loc:''};
  document.getElementById('hm').style.display = 'block';
  document.getElementById('qs').style.display = 'block';
  document.getElementById('br').classList.remove('sh');
  document.getElementById('tbv').style.display = 'none';
  document.getElementById('extraPanels').innerHTML = '';
  renderHome();
  renderQuote();
}

// ===== TEXTBOOK ENHANCEMENTS =====
const FAV_TB_KEY = STORE_KEY + '_tb_favs';
function getTbFavs() { return JSON.parse(localStorage.getItem(FAV_TB_KEY) || '[]'); }
function toggleTbFav(id) {
  let favs = getTbFavs();
  const idx = favs.indexOf(id);
  if (idx >= 0) favs.splice(idx, 1); else favs.push(id);
  localStorage.setItem(FAV_TB_KEY, JSON.stringify(favs));
  if (document.getElementById('tbvPicker').style.display === 'flex') {
    document.getElementById('tbvPickerGrid').innerHTML = ''; renderPublishers();
  }
}

// Textbook search + heatmap
const _origRenderCh = renderChapterList;
renderChapterList = function(query) {
  const chList = document.getElementById('tbvChapterList');
  if (!currentTB) { chList.innerHTML = ''; return; }
  const q = (query||'').toLowerCase();
  const maxSects = Math.max(...currentTB.chapters.map(c=>c.sections.length),1);
  let h = `<div style="padding:0 0 8px"><input id="tbvSearch" placeholder="🔍 搜索章节..." oninput="clearTimeout(window._tbs);window._tbs=setTimeout(()=>renderChapterList(this.value),200)" style="width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px;background:var(--card-bg);color:var(--text);outline:none;box-sizing:border-box"></div>`;
  for (let i=0; i<currentTB.chapters.length; i++) {
    const ch = currentTB.chapters[i];
    if (q && !ch.name.toLowerCase().includes(q) && !ch.sections.some(s=>s.name.toLowerCase().includes(q))) continue;
    const active = currentChapter&&currentChapter.num===ch.num?'on':'';
    const pct = ch.sections.length/maxSects;
    const barCol = pct>0.7?'#ef4444':pct>0.4?'#f97316':'#22c55e';
    h += `<div class="tbv-chapter-item ${active}" onclick="selectChapter(${i})">
      <span class="tbv-ch-num">第${ch.num}章</span>
      <span class="tbv-ch-name">${esc(ch.name)}</span>
      <div style="flex:1;display:flex;align-items:center;justify-content:flex-end;gap:6px">
        <div style="width:50px;height:5px;background:var(--border);border-radius:3px;overflow:hidden">
          <div style="width:${pct*100}%;height:100%;background:${barCol};border-radius:3px"></div></div>
        <span class="tbv-ch-cnt">${ch.sections.length}节</span>
      </div>
    </div>`;
  }
  if (q&&!h) h+='<div style="text-align:center;padding:20px;color:var(--text-muted);font-size:13px">未找到匹配章节</div>';
  chList.innerHTML = h;
};
// Knowledge entries under sections
function secLevel(sec) {
  const dots = (sec.num.match(/\./g)||[]).length;
  if (dots === 0) return 'sub';     // "1", "2" 纯数字 → 子节
  if (dots === 1) return 'main';    // "1.1" 一个点 → 节
  return 'tert';                     // "1.1.1" 两个以上点 → 小节
}
let _fromTextbook = null; // {tb, ch} for KP click from textbook view

const _origRenderSec = renderSections;
// KP 兼容两种格式：字符串（初中旧数据）或 {name, evidence}（小学新数据）
const _kpName = function (kp) { return typeof kp === 'string' ? kp : ((kp && kp.name) || ''); };
const _kpEvidence = function (kp) { return typeof kp === 'string' ? '' : ((kp && kp.evidence) || ''); };
renderSections = function() {
  const list = document.getElementById('tbvSectionList');
  if (!currentChapter) { list.innerHTML=''; return; }
  document.getElementById('tbvTitle').textContent = `${currentTB.iconText||'📘'} ${currentTB.label} · 第${currentChapter.num}章 ${currentChapter.name}`;
  const KPBG = ['#ede9fe','#e0f2fe','#d1fae5','#ffedd5','#ffe4e6','#fef3c7','#cffafe','#fce7f3'];
  const KPTX = ['#7c3aed','#0284c7','#059669','#ea580c','#e11d48','#d97706','#0891b2','#db2777'];
  const DEBG = ['#fee2e2','#ffedd5','#fef3c7','#fce7f3'];
  const DETX = ['#b91c1c','#c2410c','#b45309','#be185d'];
  let h = '', kpIdx = 0;
  const tagBlock = function(items, kind, ci) {
    const isDe = kind === 'de';
    const bgArr = isDe ? DEBG : KPBG;
    const tcArr = isDe ? DETX : KPTX;
    const bg = bgArr[ci % bgArr.length], tc = tcArr[ci % tcArr.length];
    const LIMIT = 10;
    let out = `<div class="${isDe ? 'de-tags' : 'kp-tags'}">`;
    const shown = items.slice(0, LIMIT);
    for (let i = 0; i < shown.length; i++) {
      const nm = _kpName(shown[i]);
      if (!nm) continue;
      const ev = _kpEvidence(shown[i]);
      const hit = !isDe && D && D.some(function (e) { return e.t === nm; });
      const tip = ev ? `title="${esc(ev)}"` : (hit ? '' : 'title="待补充内容"');
      const attr = hit
        ? `onclick="event.stopPropagation();var _tb=currentTB,_ch=currentChapter;goHome();st.loc='';st.sdTab='';st.q='${escQ(nm)}';document.getElementById('sq').value='${escQ(nm)}';document.getElementById('hm').style.display='none';document.getElementById('qs').style.display='none';document.getElementById('br').classList.add('sh');renderModuleTabs();renderSidebar();renderResults();_fromTextbook={tb:_tb,ch:_ch};document.getElementById('navTbBtn').style.display='';document.getElementById('navBackBtn').style.display='none';"`
        : '';
      out += `<span class="tg" ${tip} ${attr} style="font-size:12px;padding:4px 12px;border-radius:8px;background:${bg};border:1px solid ${tc}44;color:${tc};font-weight:500;transition:all .15s;cursor:${hit ? 'pointer' : 'default'}${hit ? '' : ';opacity:0.65'}" onmouseenter="this.style.background='${tc}';this.style.color='#fff'" onmouseleave="this.style.background='${bg}';this.style.color='${tc}'">${isDe ? '⚠️' : '🔹'}${esc(nm)}</span>`;
    }
    if (items.length > LIMIT) out += `<span style="font-size:11px;color:var(--text-muted)">+${items.length - LIMIT}更多</span>`;
    out += '</div>';
    return out;
  };
  for (let si = 0; si < currentChapter.sections.length; si++) {
    const sec = currentChapter.sections[si];
    const level = secLevel(sec);
    const isSubOrTert = level === 'sub' || level === 'tert';
    const nextSec = currentChapter.sections[si + 1];
    const hasOwnSub = isSubOrTert ? false : (nextSec && !String(nextSec.num).includes('.'));
    const kps = sec.kps || [];
    const des = sec.des || [];
    const kpCount = kps.length, deCount = des.length;
    const showKp = isSubOrTert || ((kpCount > 0 || deCount > 0) && !hasOwnSub);
    if (kpCount || deCount) kpIdx++;
    const ci = Math.max(0, kpIdx - 1);
    const pageTip = (sec.pages && sec.pages.length === 2) ? `title="教材 p.${sec.pages[0]}–${sec.pages[1]}"` : '';
    h += `<div class="tbv-section-row section-${level}" style="${isSubOrTert ? 'cursor:pointer' : 'cursor:default'}" ${pageTip} ${isSubOrTert ? `onclick="filterBySection('${escQ(sec.name)}')"` : ''}>
      <span class="tbv-sr-num${isSubOrTert ? ' ' + level : ''}">${esc(sec.num)}</span>
      <span class="tbv-sr-name${isSubOrTert ? ' ' + level : ''}">${esc(sec.name)}</span>
      ${showKp ? `<span class="tbv-sr-cnt">${kpCount}个知识点${deCount ? ' · ' + deCount + '个易错点' : ''} ▶</span>` : ''}</div>`;
    if (showKp && kpCount) h += tagBlock(kps, 'kp', ci);
    if (showKp && deCount) h += tagBlock(des, 'de', ci);
  }
  list.innerHTML = h;
};

function runOverComparison() {
  const results = document.getElementById('tbvCompareResults');
  if (!comparePrimary || compareTargets.length === 0) return;
  
  const learnedSects = new Set();
  const learnedChaps = new Set();
  for (const ch of comparePrimary.chapters) {
    learnedChaps.add(ch.name);
    for (const sec of ch.sections) learnedSects.add(sec.name);
  }
  
  const gradeOrder = {'一年级上册':1,'一年级下册':2,'二年级上册':3,'二年级下册':4,'三年级上册':5,'三年级下册':6,'四年级上册':7,'四年级下册':8,'五年级上册':9,'五年级下册':10,'六年级上册':11,'六年级下册':12,'七年级上册':13,'七年级下册':14,'八年级上册':15,'八年级下册':16,'九年级上册':17,'九年级下册':18};
  const pGrade = gradeOrder[comparePrimary.grade] || 3;
  for (const book of TB) {
    if (book.publisher === comparePrimary.publisher && book.id !== comparePrimary.id) {
      const bGrade = gradeOrder[book.grade] || 0;
      if (bGrade < pGrade) {
        for (const ch of book.chapters) {
          learnedChaps.add(ch.name);
          for (const sec of ch.sections) learnedSects.add(sec.name);
        }
      }
    }
  }
  
  let overall = `<div class="tbv-cr-header">📌 超纲检测 — ${esc(comparePrimary.label)} (主教材) ↔ ${compareTargets.length}本对比教材</div>`;
  
  for (const target of compareTargets) {
    let overCount = 0, matchCount = 0;
    let h = `<div class="tbv-cr-chapter" style="background:var(--hover-bg);font-size:11px;margin-top:4px">📘 ${esc(target.label)}</div>`;
    for (const ch of target.chapters) {
      const overSections = [];
      const matchedSections = [];
      for (const sec of ch.sections) {
        if (learnedSects.has(sec.name)) { matchedSections.push(sec); matchCount++; }
        else { overSections.push(sec); overCount++; }
      }
      if (overSections.length > 0) {
        h += `<div class="tbv-cr-chapter">📖 第${ch.num}章 ${esc(ch.name)} <span class="tbv-cr-tag over">${overSections.length}节超纲</span></div>`;
        for (const sec of overSections) {
          h += `<div class="tbv-cr-section"><span class="tbv-cr-tag over">超纲</span> ${esc(sec.num)} ${esc(sec.name)}</div>`;
        }
      } else {
        h += `<div class="tbv-cr-chapter">📖 第${ch.num}章 ${esc(ch.name)} <span class="tbv-cr-tag match">全部匹配</span></div>`;
        matchCount += ch.sections.length;
      }
    }
    if (overCount === 0) {
      h += `<div class="tbv-cr-empty" style="padding:10px">✅ 全部 ${matchCount} 节均已在主教材覆盖范围内</div>`;
    } else {
      h += `<div class="tbv-cr-section" style="padding:6px 14px;border-top:1px solid var(--border);font-size:11px;color:var(--text-muted)">共 ${overCount} 节超纲 · ${matchCount} 节已匹配</div>`;
    }
    overall += h;
  }
  results.innerHTML = overall;
}

      <div class="tbv-pc-name">${esc(book.label)}</div>
    </div>`;
  }
  grid.innerHTML = h;
}

function pickLearnedTargetBook(id) {
  const book = TB.find(b => b.id === id);
  if (!book) return;
  learnedTargets.push(book);
  renderLearnedTags();
  // Just hide the selected card instead of full refresh
  const cards = document.querySelectorAll('#tbvPickerGrid .tbv-picker-card');
  for (const card of cards) {
    if (card.getAttribute('onclick') && card.getAttribute('onclick').includes(id)) {
      card.style.display = 'none';
      break;
    }
  }
  if (learnedPrimary && learnedTargets.length > 0) runLearnedCheck();
}

function removeLearnedTarget(id) {
  learnedTargets = learnedTargets.filter(t => t.id !== id);
  renderLearnedTags();
  if (learnedPrimary && learnedTargets.length > 0) runLearnedCheck();
  else if (learnedTargets.length === 0) {
    document.getElementById('tbvLearnedResults').innerHTML = '<div class="tbv-cr-empty">请选择至少一本已学教材</div>';
  }
}

function renderLearnedTags() {
  const container = document.getElementById('tbvLearnedTags');
  let h = '';
  for (const book of learnedTargets) {
    const bg = book.iconBg || '#6366f1';
    h += `<span class="tbv-learned-tag" style="border-color:${bg}">
      <span class="tbv-sel-badge" style="background:${bg}">${book.iconText||'📘'}</span>
      ${esc(book.label)}
      <span class="tbv-learned-remove" onclick="removeLearnedTarget('${escQ(book.id)}')">✕</span>
    </span>`;
  }
  container.innerHTML = h;
}

function runLearnedCheck() {
  const results = document.getElementById('tbvLearnedResults');
  if (!learnedPrimary || learnedTargets.length === 0) return;
  
  // Collect all sections from all learned textbooks
  const learnedSects = new Set();
  const learnedChaps = new Set();
  for (const book of learnedTargets) {
    for (const ch of book.chapters) {
      learnedChaps.add(ch.name);
      for (const sec of ch.sections) learnedSects.add(sec.name);
    }
  }
  
  // Also include same-publisher lower grades
  const gradeOrder = {'一年级上册':1,'一年级下册':2,'二年级上册':3,'二年级下册':4,'三年级上册':5,'三年级下册':6,'四年级上册':7,'四年级下册':8,'五年级上册':9,'五年级下册':10,'六年级上册':11,'六年级下册':12,'七年级上册':13,'七年级下册':14,'八年级上册':15,'八年级下册':16,'九年级上册':17,'九年级下册':18};
  const pGrade = gradeOrder[learnedPrimary.grade] || 3;
  for (const book of TB) {
    if (book.publisher === learnedPrimary.publisher && book.id !== learnedPrimary.id) {
      const bGrade = gradeOrder[book.grade] || 0;
      if (bGrade < pGrade) {
        for (const ch of book.chapters) {
          learnedChaps.add(ch.name);
          for (const sec of ch.sections) learnedSects.add(sec.name);
        }
      }
    }
  }
  
  let learnedCount = 0, newCount = 0;
  let h = `<div class="tbv-cr-header">📖 ${esc(learnedPrimary.label)} — 已学检测 (${learnedTargets.length}本已学教材)</div>`;
  
  for (const ch of learnedPrimary.chapters) {
    const learnedSecs = [];
    const newSecs = [];
    for (const sec of ch.sections) {
      if (learnedSects.has(sec.name)) { learnedSecs.push(sec); learnedCount++; }
      else { newSecs.push(sec); newCount++; }
    }
    if (newSecs.length === 0 && learnedSecs.length > 0) {
      h += `<div class="tbv-cr-chapter">📖 第${ch.num}章 ${esc(ch.name)} <span class="tbv-cr-tag match">全部已学</span></div>`;
    } else if (newSecs.length > 0) {
      h += `<div class="tbv-cr-chapter">📖 第${ch.num}章 ${esc(ch.name)}</div>`;
      for (const sec of learnedSecs) {
        h += `<div class="tbv-cr-section"><span class="tbv-cr-tag match">已学</span> ${esc(sec.num)} ${esc(sec.name)}</div>`;
      }
      for (const sec of newSecs) {
        h += `<div class="tbv-cr-section"><span class="tbv-cr-tag over">未学</span> ${esc(sec.num)} ${esc(sec.name)}</div>`;
      }
    }
  }
  
  if (newCount === 0) {
    h = `<div class="tbv-cr-header">📖 ${esc(learnedPrimary.label)} — 已学检测</div>
      <div class="tbv-cr-empty" style="padding:20px;color:#16a34a">✅ 恭喜！全部 ${learnedCount} 节内容已学完！</div>`;
  } else {
    h += `<div class="tbv-cr-section" style="padding:8px 14px;border-top:1px solid var(--border);font-size:11px;color:var(--text-muted);background:var(--hover-bg)">
      ✅ 已学 ${learnedCount} 节 · 📌 未学 ${newCount} 节
    </div>`;
  }
  results.innerHTML = h;
}

// ===== SIDEBAR =====
// ===== 教材定位索引(KP 名称 → 教材/章/节) =====
let kpLocIndex = null;
let locLabels = {};
function buildKpLocIndex() {
  if (kpLocIndex) return;
  kpLocIndex = {};
  for (const b of TB) {
    const stage = b.stage || '初中';
    const bookKey = stage + '|' + b.publisher + '|' + b.grade;
    for (const ch of b.chapters) {
      const chKey = bookKey + '|' + ch.num;
      for (const sec of ch.sections) {
        const secKey = chKey + '|' + sec.num;
        for (const kp of (sec.kps || [])) {
          const nm = (typeof kp === 'string' ? kp : (kp && kp.name) || '').trim();
          if (!nm) continue;
          const arr = kpLocIndex[nm] || (kpLocIndex[nm] = []);
          if (!arr.some(function(l){ return l.secKey === secKey; })) {
            arr.push({stage:stage, pub:b.publisher, grade:b.grade, bookKey:bookKey,
              chNum:ch.num, chName:ch.name, chKey:chKey,
              secNum:sec.num, secName:sec.name, secKey:secKey});
          }
        }
      }
    }
  }
}
function entryLocs(e) {
  buildKpLocIndex();
  return kpLocIndex[(e.t || '').trim()] || [];
}
function locMatches(l) {
  if (!st.loc) return true;
  return l.secKey === st.loc || l.chKey === st.loc || l.bookKey === st.loc;
}
function getFilteredEntries() {
  const out = [];
  for (const e of D) {
    if (st.m && e.m !== st.m) continue;
    if (st.c1 && e.c1 !== st.c1) continue;
    if (st.c2 && e.c2 !== st.c2) continue;
    if (st.tp !== 'all' && e.tp !== st.tp) continue;
    if (st.ar && (!e.areas || e.areas.indexOf(st.ar) < 0)) continue;
    if (st.q) {
      const q = st.q.toLowerCase();
      if (e.t.toLowerCase().indexOf(q)<0 && (e.d||'').toLowerCase().indexOf(q)<0 &&
          (e.c1||'').toLowerCase().indexOf(q)<0 && (e.c2||'').toLowerCase().indexOf(q)<0 &&
          (e.c3||'').toLowerCase().indexOf(q)<0 && (e.x||'').toLowerCase().indexOf(q)<0) continue;
    }
    out.push(e);
  }
  return out;
}
function setSdTab(t) {
  st.sdTab = t;
  renderSidebar();
}
function setLoc(key) {
  st.loc = (st.loc === key) ? '' : key;
  st.sdTab = 'loc';
  renderResults();
}
function clearLoc() {
  st.loc = '';
  renderResults();
}
function _secOrder(n) {
  return String(n).split('.').map(function(x){ return parseInt(x,10) || 0; });
}
function _secCmp(a,b) {
  const A=_secOrder(a.info.secNum), B=_secOrder(b.info.secNum);
  for (let i=0;i<Math.max(A.length,B.length);i++) {
    const d=(A[i]||0)-(B[i]||0);
    if (d) return d;
  }
  return 0;
}
function renderLocTree(items) {
  buildKpLocIndex();
  locLabels = {};
  const books = {};
  let matched = 0, unlocated = 0;
  for (const e of items) {
    const locs = entryLocs(e);
    if (!locs.length) { unlocated++; continue; }
    matched++;
    for (const l of locs) {
      const bk = books[l.bookKey] || (books[l.bookKey] = {info:l, cnt:0, chs:{}});
      bk.cnt++;
      const ck = bk.chs[l.chKey] || (bk.chs[l.chKey] = {info:l, cnt:0, secs:{}});
      ck.cnt++;
      const sk = ck.secs[l.secKey] || (ck.secs[l.secKey] = {info:l, cnt:0});
      sk.cnt++;
    }
  }
  const bookList = Object.keys(books).map(function(k){ return books[k]; }).sort(function(a,b){ return b.cnt - a.cnt; });
  let h = '<div class="sl"><div class="shd">📚 教材定位</div>';
  h += `<div class="si ${!st.loc?'on':''}" onclick="clearLoc()"><span class="nm">全部结果</span><span class="cn">${items.length}</span></div>`;
  h += `<div class="loc-meta">命中 ${matched} 条有出处${unlocated ? ' · '+unlocated+' 条未收录' : ''}</div>`;
  if (!bookList.length) {
    h += '<div class="loc-empty">当前结果没有教材出处信息</div>';
  }
  const CAP_B = 12, CAP_C = 12, CAP_S = 10;
  for (const bk of bookList.slice(0, CAP_B)) {
    const bi = bk.info;
    locLabels[bi.bookKey] = bi.pub + ' ' + bi.grade;
    h += `<div class="si ${st.loc===bi.bookKey?'on':''}" onclick="setLoc('${escQ(bi.bookKey)}')"><span class="nm">${esc(bi.pub)} ${esc(bi.grade)}</span><span class="cn">${bk.cnt}</span></div>`;
    const chs = Object.keys(bk.chs).map(function(k){ return bk.chs[k]; }).sort(function(a,b){ return a.info.chNum - b.info.chNum; });
    for (const ck of chs.slice(0, CAP_C)) {
      const ci = ck.info;
      locLabels[ci.chKey] = ci.pub + ' ' + ci.grade + ' · 第' + ci.chNum + '章 ' + ci.chName;
      h += `<div class="si lv2 ${st.loc===ci.chKey?'on':''}" onclick="setLoc('${escQ(ci.chKey)}')"><span class="nm">第${ci.chNum}章 ${esc(ci.chName)}</span><span class="cn">${ck.cnt}</span></div>`;
      const secs = Object.keys(ck.secs).map(function(k){ return ck.secs[k]; }).sort(_secCmp);
      for (const sk of secs.slice(0, CAP_S)) {
        const si = sk.info;
        locLabels[si.secKey] = si.pub + ' ' + si.grade + ' · 第' + si.chNum + '章 ' + si.chName + ' · ' + si.secNum + ' ' + si.secName;
        h += `<div class="si lv3 ${st.loc===si.secKey?'on':''}" onclick="setLoc('${escQ(si.secKey)}')"><span class="nm">${esc(si.secNum)} ${esc(si.secName)}</span><span class="cn">${sk.cnt}</span></div>`;
      }
      if (secs.length > CAP_S) h += `<div class="loc-more">+${secs.length - CAP_S} 个小节</div>`;
    }
    if (chs.length > CAP_C) h += `<div class="loc-more">+${chs.length - CAP_C} 章</div>`;
  }
  if (bookList.length > CAP_B) h += `<div class="loc-more">+${bookList.length - CAP_B} 本教材</div>`;
  h += '</div>';
  return h;
}
function renderSidebar(items) {
  const sd = document.getElementById('sd');
  if (!st.m && !st.q) { sd.innerHTML=''; sd.classList.remove('sh'); return; }
  sd.classList.add('sh');
  if (!st.sdTab) st.sdTab = st.q ? 'loc' : 'cat';
  const tab = st.sdTab;
  let h = '<div class="sd-tabs">'
    + `<span class="sdt ${tab==='loc'?'on':''}" onclick="setSdTab('loc')">📚 教材定位</span>`
    + `<span class="sdt ${tab==='cat'?'on':''}" onclick="setSdTab('cat')">📂 分类筛选</span>`
    + '</div>';
  if (tab === 'loc') {
    h += renderLocTree(items || getFilteredEntries());
    sd.innerHTML = h;
    return;
  }
  if (!st.m) {
    h += '<div class="sl"><div class="shd">📂 分类筛选</div><div class="loc-empty">先在顶部选择学段（小学/初中/中考）后可按分类筛选</div></div>';
    sd.innerHTML = h;
    return;
  }
  const cats = T[st.m] || {};
  const c1s = Object.keys(cats).sort((a,b) => (S[st.m]?.cs?.[b]||0) - (S[st.m]?.cs?.[a]||0));
  h += '<div class="sl"><div class="shd">📂 分类筛选</div>';
  if (st.c1 && cats[st.c1]) {
    h += `<div class="sbk" onclick="selectC1()">← ${esc(st.c1)}</div>`;
    const c2s = cats[st.c1];
    const ns = Object.keys(c2s).sort((a,b) => (c2s[b]||0)-(c2s[a]||0));
    for (const c2 of ns) {
      if (!c2) continue;
      const a = st.c2===c2?'on':'';
      h += `<div class="si ${a}" onclick="selectC2('${escQ(st.c1)}','${escQ(c2)}')"><span class="nm">${esc(c2)}</span><span class="cn">${c2s[c2]}</span></div>`;
    }
  } else {
    for (const c1 of c1s) {
      const c2s = cats[c1];
      let tot = 0;
      for (const k in c2s) tot += c2s[k];
      const a = st.c1===c1?'on':'';
      h += `<div class="si ${a}" onclick="selectC1('${escQ(c1)}')"><span class="ar">▶</span><span class="nm">${esc(c1)}</span><span class="cn">${tot}</span></div>`;
    }
  }
  h += '</div>';
  sd.innerHTML = h;
}

function selectC1(c1) {
  st.loc='';
  if (c1) { st.c1=c1; st.c2=''; } else { st.c1=''; st.c2=''; }
  renderSidebar(); renderResults();

function selectC2(c1,c2) {

}

function renderResults() {

  const baseFil = getFilteredEntries();
  let fil = baseFil;
  if (st.loc) {
    fil = baseFil.filter(function(e){ return entryLocs(e).some(locMatches); });
  }

  renderSidebar(baseFil);

  // Info
  const pts = ['共 <strong>'+fil.length+'</strong> 条知识'];
  if (st.q) pts.push('搜索: "'+esc(st.q)+'"');

  if (st.c1 && st.m!=='中考数学') pts.push(st.c1+(st.c2?' → '+st.c2:''));
  if (st.loc) {
    pts.push('📚 定位: ' + esc(locLabels[st.loc] || st.loc) + ' <span style="cursor:pointer;color:var(--accent);font-weight:600" onclick="clearLoc()">✕ 清除</span>');

    const typeLabel = {basic:'基础',extend:'拓展',exam:'高频考点'}[e.tp];

      : '<span class="action-btn" onclick="toggleFav('+i+',event)">☆ 收藏</span>';

      ? '<span class="action-btn learned" onclick="toggleLearned('+i+',event)">✅ 已掌握</span>'
      : '<span class="action-btn" onclick="toggleLearned('+i+',event)">📖 标记</span>';

      ${headerHtml}

  }
  document.getElementById('rs').innerHTML = h;
}

// ===== FAVORITES =====
function isFav(e) {
  const favs = JSON.parse(localStorage.getItem(STORE_KEY+'_favs') || '[]');
  return favs.some(f => f.t === e.t && f.m === e.m);
}
function toggleFav(idx, event) {
  if (event) event.stopPropagation();
  const e = filterCurrentResults()[idx];
  if (!e) return;
  let favs = JSON.parse(localStorage.getItem(STORE_KEY+'_favs') || '[]');
  const existing = favs.findIndex(f => f.t === e.t && f.m === e.m);
  if (existing >= 0) {
    favs.splice(existing, 1);
  } else {
    favs.push({t: e.t, m: e.m, d: e.d ? e.d.slice(0,60) : '', c1: e.c1, savedAt: Date.now()});
  }
  localStorage.setItem(STORE_KEY+'_favs', JSON.stringify(favs));
  renderResults();
}
function showFavorites() {
  const panel = document.getElementById('extraPanels');
  const favs = JSON.parse(localStorage.getItem(STORE_KEY+'_favs') || '[]');
  if (!favs.length) {
    panel.innerHTML = '<div class="fav-panel"><h4>⭐ 收藏夹</h4><div class="fav-empty">还没有收藏的知识点</div></div>';
    return;
  }
  let h = '<div class="fav-panel"><h4>⭐ 收藏夹 <span style="font-weight:400;font-size:12px;color:var(--text-muted)">('+favs.length+')</span></h4><div class="fav-list">';
  for (const f of favs) {
    h += `<span class="fav-tag" onclick="searchFav('${escQ(f.t)}')">${esc(f.t)}</span>`;
  }
  h += '</div></div>';
  panel.innerHTML = h;
}

function searchFav(title) {
  st.q = title;
  document.getElementById('sq').value = title;
  if (!st.m) {
    st.m = '小学';
    document.getElementById('hm').style.display='none';
    document.getElementById('qs').style.display='none';
    document.getElementById('br').classList.add('sh');
    renderModuleTabs();
    renderSidebar();
  }
  renderResults();
}

function showLearningProgress() {
  const panel = document.getElementById('extraPanels');

  const total = D.length;

  }
  let h = `<div class="fav-panel">

      <span style="font-size:13px;color:var(--text-muted)">完成度 <strong style="color:#22c55e">${pct}%</strong></span>
    </div>
    <div style="height:6px;background:var(--border);border-radius:4px;overflow:hidden;margin-bottom:12px">
      <div style="height:100%;width:${pct}%;background:linear-gradient(90deg,#22c55e,#4ade80);border-radius:4px;transition:width .5s"></div>

    h += '<div class="fav-list">';

    }

  }
  h += '</div>';
  panel.innerHTML = h;

// ===== KNOWLEDGE GRAPH (D3.js) =====
let graphActive = false;
let graphBuilt = false;

function toggleGraph() {
  graphActive = !graphActive;
  const results = document.getElementById('rs');
  const graphContainer = document.getElementById('graphContainer');
  if (!results) return;

  if (graphActive) {
    // Show graph in the results area
    graphContainer.style.display = 'block';
    // Insert graph right after the "loading" bar but in the results spot
    const parent = results.parentNode;
    parent.insertBefore(graphContainer, results);
    results.style.display = 'none';
    if (!graphBuilt) setTimeout(buildGraph, 100);
    document.querySelector('[onclick*="toggleGraph"]').textContent = '📇 卡片';
  } else {
    results.style.display = '';
    graphContainer.style.display = 'none';
    document.querySelector('[onclick*="toggleGraph"]').textContent = '📊 图谱';
  }
}

function buildGraph() {
  if (!D || !D.length || typeof d3 === 'undefined') return;

  // Build tree: module → c1 → c2
  const treeData = { name: '数学探索中心', children: [] };
  const moduleMap = {};

  for (const e of D) {
    const m = e.m || '其他', c1 = e.c1 || '未分类', c2 = e.c2 || '';
    if (!moduleMap[m]) moduleMap[m] = { name: m, children: [], _count: 0 };
    moduleMap[m]._count++;
    let n1 = moduleMap[m].children.find(c => c.name === c1);
    if (!n1) { n1 = { name: c1, children: [], _count: 0 }; moduleMap[m].children.push(n1); }
    n1._count++;
    if (c2) {
      let n2 = n1.children.find(s => s.name === c2);
      if (!n2) { n2 = { name: c2, children: [], _count: 0 }; n1.children.push(n2); }
      n2._count++;
    }
  }

  for (const mod of Object.values(moduleMap)) {
    for (const c1 of mod.children) {
      c1.children.sort((a, b) => b._count - a._count);
      if (c1.children.length > 8) c1.children = c1.children.slice(0, 8);
    }
    mod.children.sort((a, b) => b._count - a._count);
  }
  treeData.children = Object.values(moduleMap).sort((a, b) => b._count - a._count);

  const modColors = { '小学': '#f97316', '初中': '#22c55e', '中考数学': '#a855f7', '其他': '#64748b' };
  const modLabels = { '小学': '🎒 小学', '初中': '📐 初中', '中考数学': '🎯 中考', '其他': '其他' };

  const container = document.getElementById('graphSvg');
  if (!container) return;
  container.innerHTML = '';

  const W = container.clientWidth || 800;
  const H = Math.max(500, window.innerHeight * 0.65);

  const legendEl = document.getElementById('graphLegend');
  if (legendEl) {
    legendEl.innerHTML = Object.entries(modColors).map(([k, v]) =>
      `<span class="gl-item" style="background:${v}22;color:${v}">${modLabels[k] || k}</span>`
    ).join('');
  }

  const svg = d3.select(container).append('svg').attr('width', W).attr('height', H).attr('viewBox', [0, 0, W, H]);
  const tooltip = d3.select(container.parentElement).append('div').attr('class', 'graph-tooltip');
  const root = d3.hierarchy(treeData);
  const nodes = root.descendants(), links = root.links();

  function nodeId(d) { return d.ancestors().reverse().slice(1).map(n => n.data.name).join('/'); }

  const showNodes = nodes.filter(n => n.depth === 0 || n.depth === 1 || n.depth === 2 ||
    (n.depth === 3 && n.parent && n.parent.children.indexOf(n) < 4));
  const ns = new Set(showNodes.map(n => nodeId(n)));
  const showLinks = links.filter(l => ns.has(nodeId(l.source)) && ns.has(nodeId(l.target)));

  function nc(d) {
    if (d.depth === 0) return '#6366f1';
    if (d.depth === 1) return modColors[d.data.name] || '#64748b';
    return modColors[d.depth === 2 ? d.parent.data.name : d.parent.parent.data.name] || '#64748b';
  }
  function nl(d) {
    if (d.depth === 0) return '🧮 数学探索中心';
    if (d.depth === 1) return modLabels[d.data.name] || d.data.name;
    return d.data.name;
  }
  function sz(d) {
    const base = { 0: 32, 1: 26, 2: 18, 3: 10 };
    const extra = d.depth >= 2 ? Math.min((d.data._count || 1) / 15, 10) : 0;
    return (base[d.depth] || 8) + extra;
  }

  const g = svg.append('g');
  const zoom = d3.zoom().scaleExtent([0.3, 4]).on('zoom', e => g.attr('transform', e.transform));
  svg.call(zoom);

  g.selectAll('.link').data(showLinks).join('line').attr('class', 'link');
  const ng = g.selectAll('.node').data(showNodes).join('g').attr('class', 'node');

  ng.append('text').attr('text-anchor', 'middle').attr('dy', d => d.depth >= 2 ? 4 : 5)
    .style('font-size', d => d.depth === 0 ? 14 : d.depth === 1 ? 13 : 11)
    .style('fill', '#f1f5f9').style('stroke', 'none').text(d => nl(d));

  ng.append('text').attr('text-anchor', 'middle').attr('dy', d => d.depth >= 2 ? 4 : 5)
    .style('font-size', d => d.depth === 0 ? 14 : d.depth === 1 ? 13 : 11)
    .style('font-weight', d => d.depth <= 1 ? 700 : 500)
    .style('fill', d => d.depth === 0 ? '#4338ca' : '#1e293b').text(d => nl(d));

  ng.append('circle').attr('r', d => sz(d))
    .style('fill', d => { const c = nc(d); return d.depth <= 1 ? c : c + '30'; })
    .style('stroke', d => nc(d));

  ng.filter(d => d.depth >= 2).append('text').attr('text-anchor', 'middle')
    .attr('dy', d => sz(d) + 14).style('font-size', '10px').style('fill', '#94a3b8')
    .text(d => `${d.data._count} 条`);

  const sim = d3.forceSimulation(showNodes)
    .force('link', d3.forceLink(showLinks).id(d => nodeId(d))
      .distance(d => d.source.depth === 0 ? 80 : d.source.depth === 1 ? 100 : 60))
    .force('charge', d3.forceManyBody().strength(d => d.depth === 0 ? -500 : d.depth === 1 ? -300 : d.depth === 2 ? -150 : -40))
    .force('center', d3.forceCenter(W / 2, H / 2))
    .force('collision', d3.forceCollide().radius(d => sz(d) + 20))
    .alphaDecay(0.02)
    .on('tick', () => {
      ng.attr('transform', d => `translate(${d.x},${d.y})`);
      g.selectAll('.link').attr('x1', d => d.source.x).attr('y1', d => d.source.y)
        .attr('x2', d => d.target.x).attr('y2', d => d.target.y);
    });

  ng.call(d3.drag()
    .on('start', (e, d) => { if (!e.active) sim.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
    .on('drag', (e, d) => { d.fx = e.x; d.fy = e.y; })
    .on('end', (e, d) => { if (!e.active) sim.alphaTarget(0); d.fx = null; d.fy = null; })
  );

  ng.on('mouseenter', (e, d) => {
    tooltip.style('background', nc(d))
      .html(`<strong>${nl(d)}</strong><br><span style="opacity:.8">${d.data._count || D.length} 条</span>`)
      .classed('visible', true);
  }).on('mousemove', e => {
    const r = container.getBoundingClientRect();
    tooltip.style('left', (e.clientX - r.left + 14) + 'px').style('top', (e.clientY - r.top - 10) + 'px');
  }).on('mouseleave', () => tooltip.classed('visible', false));

  ng.on('click', (e, d) => {
    if (d.depth < 2) return;
    const p = d.parent; if (!p) return;
    const mod = d.depth === 2 ? p.data.name : p.parent.data.name;
    const c1 = d.depth === 2 ? d.data.name : p.data.name;
    const c2 = d.depth === 3 ? d.data.name : '';

    graphActive = false;
    document.getElementById('graphContainer').style.display = 'none';
    document.querySelector('[onclick*="toggleGraph"]').textContent = '📊 图谱';
    document.getElementById('rs').style.display = '';

    st.m = mod; st.c1 = c1; st.c2 = c2; st.tp = 'all'; st.q = ''; st.ar = '';
    document.getElementById('sq').value = '';
    if (typeof renderModuleTabs === 'function') renderModuleTabs();
    if (typeof renderSidebar === 'function') renderSidebar();
    if (typeof renderResults === 'function') renderResults();
  });

  svg.call(zoom.transform, d3.zoomIdentity);
  graphBuilt = true;
}

// ===== UTILITY =====
function filterCurrentResults() {
  const fil = [];
  for (const e of D) {
    if (st.m && e.m !== st.m) continue;
    if (st.c1 && e.c1 !== st.c1) continue;
    if (st.c2 && e.c2 !== st.c2) continue;
    if (st.tp !== 'all' && e.tp !== st.tp) continue;
    if (st.ar && (!e.areas || e.areas.indexOf(st.ar) < 0)) continue;
    if (st.q) {
      const q = st.q.toLowerCase();
      if (e.t.toLowerCase().indexOf(q)<0 && e.d.toLowerCase().indexOf(q)<0 &&
          e.c1.toLowerCase().indexOf(q)<0 && (e.c2||'').toLowerCase().indexOf(q)<0 &&
          (e.c3||'').toLowerCase().indexOf(q)<0) continue;
    }
    fil.push(e);
  }
  return fil;
}

function setupKeyboard() {

    if (e.key === '/' && !e.ctrlKey && !e.metaKey && document.activeElement !== document.getElementById('sq')) {
      e.preventDefault();
      document.getElementById('sq').focus();

    if (e.key === 'Escape') document.getElementById('sq').blur();
  });

// ===== HELPERS =====
function esc(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escQ(s) {
  return (s||'').replace(/'/g,"\\'");
}
function highlight(s, q) {
  if (!q || !s) return s;
  try {
    const r = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    return s.replace(new RegExp('('+r+')','gi'), '<mark>$1</mark>');
  } catch(e) { return s; }
}
